---
# Playbook 07: Deploy ArgoCD GitOps continuous delivery
# Deploys via Helm from localhost using a custom values file.
#
# Usage: ansible-playbook playbooks/07-deploy-argocd.yml

- name: Deploy ArgoCD to the K3s cluster
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    argocd_values: "{{ playbook_dir }}/../../k8s/argocd/values-argocd.yml"
    image_updater_values: "{{ playbook_dir }}/../../k8s/argocd/values-image-updater.yml"

  tasks:
    # -- Namespace ---------------------------------------------------------------

    - name: Create argocd namespace
      ansible.builtin.command: >
        kubectl create namespace argocd --dry-run=client -o yaml
      register: ns_manifest
      changed_when: false
      tags: [argocd]

    - name: Apply argocd namespace
      ansible.builtin.shell: >
        echo "{{ ns_manifest.stdout }}" | kubectl apply -f -
      changed_when: false
      tags: [argocd]

    # -- Helm repo ---------------------------------------------------------------

    - name: Add Argo Helm repository
      ansible.builtin.command: >
        helm repo add argo https://argoproj.github.io/argo-helm
      register: helm_repo
      changed_when: "'has been added' in helm_repo.stdout"
      failed_when: false
      tags: [argocd]

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false
      tags: [argocd]

    # -- ArgoCD admin password ---------------------------------------------------

    - name: Generate bcrypt hash of ArgoCD admin password
      ansible.builtin.command: >
        htpasswd -nbBC 10 "" {{ argocd_admin_password }}
      register: argocd_bcrypt
      changed_when: false
      tags: [argocd]

    - name: Set bcrypt hash fact
      ansible.builtin.set_fact:
        argocd_password_hash: "{{ argocd_bcrypt.stdout | regex_replace('^:', '') }}"
      tags: [argocd]

    # -- ArgoCD ------------------------------------------------------------------

    - name: Deploy ArgoCD via Helm
      ansible.builtin.command: >
        helm upgrade --install argocd
        argo/argo-cd
        --namespace argocd
        --values {{ argocd_values }}
        --set configs.secret.argocdServerAdminPassword={{ argocd_password_hash }}
        --wait
        --timeout 10m
      register: argocd_deploy
      changed_when: "'STATUS: deployed' in argocd_deploy.stdout"
      tags: [argocd]

    # --field-selector: the chart's redis-secret-init hook Job pod completes and is
    # GC'd mid-wait; a bare --all then hangs on the vanished pod until timeout
    # while every real pod is already Ready (2026-08-22, same fix as playbook 04).
    - name: Wait for ArgoCD pods to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready pods
        --all --namespace argocd
        --field-selector=status.phase=Running
        --timeout=300s
      changed_when: false
      tags: [argocd]

    # -- Gitea repo credentials for ArgoCD -------------------------------------

    - name: Create Gitea repository secret for ArgoCD
      ansible.builtin.shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: gitea-repo-creds
          namespace: argocd
          labels:
            argocd.argoproj.io/secret-type: repo-creds
        type: Opaque
        stringData:
          type: git
          url: http://gitea-http.gitea.svc.cluster.local:3000
          username: {{ gitea_admin_user }}
          password: {{ gitea_admin_password }}
        EOF
      changed_when: false
      tags: [argocd]

    # -- ArgoCD OIDC client secret (authentik SSO) -----------------------------
    # values-argocd.yml references `$argocd-oidc:client_secret`; the secret was
    # hand-made during the 2026-05 SSO rollout and nothing recreated it on
    # rebuild (found in the 2026-08-30 DR-5 dry-run sweep). The client secret
    # is in vault; the matching value also lives in authentik's provider
    # config (restored with its postgres volume), so SSO survives a rebuild.
    - name: Create ArgoCD OIDC client secret (vault)
      ansible.builtin.shell: |
        kubectl -n argocd create secret generic argocd-oidc \
          --from-literal=client_secret='{{ authentik_oidc_client_secret_argocd }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
      changed_when: false
      tags: [argocd, oidc]

    # -- eve-tracker ArgoCD Applications ---------------------------------------
    # The Application CRs previously lived ONLY in etcd (hand-applied per
    # docs/12+13) — a rebuilt cluster came up with ArgoCD empty and eve never
    # redeployed (2026-08-30 DR-5 dry-run finding). Real manifests are
    # gitignored (owner/repo values); tracked .example templates document them.
    # Skip gracefully when a file is missing (fresh-clone path).
    - name: Check for eve-tracker Application manifests
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../k8s/argocd/{{ item }}"
      register: eve_app_stats
      loop:
        - eve-tracker-app.yml
        - eve-tracker-test-app.yml
      tags: [argocd, eve-apps]

    - name: Apply eve-tracker Application manifests (when present)
      ansible.builtin.command: >
        kubectl apply -f {{ item.stat.path }}
      loop: "{{ eve_app_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      register: eve_apps_apply
      changed_when: "'configured' in eve_apps_apply.stdout or 'created' in eve_apps_apply.stdout"
      tags: [argocd, eve-apps]

    # -- ArgoCD Image Updater (CRD-based v1.1+) --------------------------------
    # Watches the Gitea container registry and patches Application specs
    # with digest-pinned images. Must be installed AFTER ArgoCD itself but
    # BEFORE any ImageUpdater CRDs are applied (it brings the CRD). See
    # k8s/argocd/values-image-updater.yml.example for the vars it reads.
    #
    # Skipped if the values file is missing (fresh-clone path without the
    # gitignored real-values file; user can still `helm upgrade --install`
    # manually once they've copied the example).

    - name: Check for Image Updater values file (skip gracefully if missing)
      ansible.builtin.stat:
        path: "{{ image_updater_values }}"
      register: iu_values_stat
      tags: [argocd, image-updater]

    - name: Deploy ArgoCD Image Updater via Helm
      ansible.builtin.command: >
        helm upgrade --install argocd-image-updater
        argo/argocd-image-updater
        --namespace argocd
        --values {{ image_updater_values }}
        --wait
        --timeout 5m
      register: image_updater_deploy
      changed_when: "'STATUS: deployed' in image_updater_deploy.stdout"
      when: iu_values_stat.stat.exists
      tags: [argocd, image-updater]

    - name: Warn when Image Updater values file is missing
      ansible.builtin.debug:
        msg: |
          Skipped argocd-image-updater install — {{ image_updater_values }}
          doesn't exist. To enable it:
            cp k8s/argocd/values-image-updater.yml.example \
               k8s/argocd/values-image-updater.yml
            # edit the Gitea registry prefix and GITEA_CREDS token
            ansible-playbook playbooks/07-deploy-argocd.yml --tags image-updater
      when: not iu_values_stat.stat.exists
      tags: [argocd, image-updater]

    # ImageUpdater CRDs for the eve apps (gitignored real files, like the apps
    # above; must apply AFTER the helm install that brings the CRD). Also
    # hand-applied historically — codified 2026-08-30 (DR-5 dry-run finding).
    - name: Check for eve-tracker ImageUpdater manifests
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../k8s/argocd/{{ item }}"
      register: eve_iu_stats
      loop:
        - eve-tracker-image-updater.yml
        - eve-tracker-test-image-updater.yml
      tags: [argocd, image-updater, eve-apps]

    - name: Apply eve-tracker ImageUpdater manifests (when present)
      ansible.builtin.command: >
        kubectl apply -f {{ item.stat.path }}
      loop: "{{ eve_iu_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      # iu_values_stat only exists when the image-updater tag ran in the same
      # invocation — default to true so a tag-scoped run still applies.
      when: item.stat.exists and (iu_values_stat.stat.exists | default(true))
      register: eve_iu_apply
      changed_when: "'configured' in eve_iu_apply.stdout or 'created' in eve_iu_apply.stdout"
      tags: [argocd, image-updater, eve-apps]

    # -- Summary -----------------------------------------------------------------

    - name: Show ArgoCD pod status
      ansible.builtin.command: kubectl get pods -n argocd -o wide
      register: argocd_pods
      changed_when: false
      tags: [verify]

    - name: Display ArgoCD pods
      ansible.builtin.debug:
        var: argocd_pods.stdout_lines
      tags: [verify]

    - name: Display ArgoCD admin credentials
      ansible.builtin.debug:
        msg: "ArgoCD admin login: admin / {{ argocd_admin_password }}"
      tags: [verify]

---
# Playbook 25: desktop SSH hardening (2026-10-02, freyr bootstrap).
# Brings Omarchy/Arch desktops to the same sshd baseline the servers carry
# (hand-applied there as 99-hardening.conf + cloud-init PasswordAuthentication
# no): key-only, no root, no keyboard-interactive. Also narrows ufw's port-22
# rule to the home subnets + the tailnet (Omarchy installs with ufw default
# deny; a bootstrap `ufw allow 22/tcp` opens it to every source).
#
# Tailscale SSH (RunSSH) answers on the tailnet IP without touching sshd, so it
# stays a way in even if this ever breaks OpenSSH.
#
# Usage: ansible-playbook ansible/playbooks/25-harden-desktop-ssh.yml --limit <host>
#        (or: make harden-desktop-ssh HOST=<host>)
# Vars:  desktop_ssh_allowed_cidrs (group_vars/all/main.yml) — defaults to the
#        tailnet ranges only. desktop_personal_pubkey_files — controller pubkeys
#        installed for personal_user (default: ~/.ssh/id_ed25519.pub + id_rsa.pub).

- name: Harden desktop sshd (key-only) + restrict ufw port 22
  hosts: desktops
  become: true
  gather_facts: true
  vars:
    ssh_allowed_cidrs: "{{ desktop_ssh_allowed_cidrs | default(['100.64.0.0/10', 'fd7a:115c:a1e0::/48']) }}"
    # Controller's own pubkeys (whoever runs this: Air, macmini) → the personal
    # user. A Tailscale-SSH-only bootstrap leaves no authorized_keys, and the
    # key-only drop-in below would then lock OpenSSH out for that user.
    personal_pubkey_files: "{{ desktop_personal_pubkey_files | default(['~/.ssh/id_ed25519.pub', '~/.ssh/id_rsa.pub']) }}"
  tasks:
    - name: Install controller pubkeys for the personal user (before key-only sshd)
      ansible.posix.authorized_key:
        user: "{{ personal_user }}"
        key: "{{ lookup('file', item | expanduser) }}"
        state: present
      loop: "{{ personal_pubkey_files }}"
      when: (item | expanduser) is file
      tags: [ssh, keys]

    # Same drop-in as the servers (10-hardening.conf) — one definition in the
    # ssh-hardening role (#80.1). Validates, then reloads a running sshd.
    - name: sshd key-only baseline (shared with servers)
      ansible.builtin.include_role:
        name: ../roles/ssh-hardening
      tags: [ssh]

    # Fresh Omarchy installs ship sshd disabled (freyr's was enabled by hand,
    # hel's was not). Desktops accept LAN SSH like the servers do. A fresh
    # start reads the drop-in written above.
    - name: Enable and start sshd
      ansible.builtin.systemd:
        name: sshd
        enabled: true
        state: started
      tags: [ssh]

    # Every desktop gets an ENABLED ufw (2026-10-17: arch-t-01 had none —
    # INPUT ACCEPT, sshd open to the remote LAN). Omarchy/CachyOS ship it active
    # already; on those the defaults are left as the distro set them.
    - name: Install ufw
      community.general.pacman:
        name: ufw
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [firewall]

    - name: Check whether ufw is active
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false
      tags: [firewall]

    # Only on a host where ufw is not yet enforcing — never rewrite the
    # policy of an already-active firewall (docker/routed setups).
    - name: ufw default policy (fresh enable only)
      community.general.ufw:
        direction: "{{ item.direction }}"
        default: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }
        - { direction: routed, policy: deny }
      when: "'Status: active' not in ufw_status.stdout"
      tags: [firewall]

    # Add the scoped rules BEFORE removing the open one (and before enabling),
    # so an interrupted run never leaves 22 closed to the LAN. ufw accepts
    # rule changes while inactive.
    - name: Allow SSH from home subnets + tailnet
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "22"
        from_ip: "{{ item }}"
        comment: ssh-scoped
      loop: "{{ ssh_allowed_cidrs }}"
      tags: [firewall]

    - name: Remove any allow-from-anywhere SSH rule
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto | default(omit) }}"
        delete: true
      loop:
        - { port: "22", proto: tcp }
        - { port: "22" }
        - { port: "ssh" }
      tags: [firewall]

    - name: Enable ufw (and at boot)
      community.general.ufw:
        state: enabled
      tags: [firewall]

    - name: ufw service enabled at boot
      ansible.builtin.systemd:
        name: ufw
        enabled: true
        state: started
      tags: [firewall]

---
# =============================================================================
# Package upgrade across all managed nodes, with auto-reboot where required.
# =============================================================================
# Idempotent: re-runnable. Already-up-to-date hosts become no-ops.
#
# Phases:
#   1. Non-cluster hosts (parallel): gpu_servers, sff_nodes, security_stack, game_servers
#      — mixed Ubuntu (apt) and CachyOS (pacman) handled by OS family
#   2. K3s agents (serial=1): preserves workload availability, kubectl wait
#   3. K3s servers (serial=1): preserves etcd quorum, kubectl wait
#   4. Arch/CachyOS desktops (parallel): pacman -Syu + reboot
#   5. macOS (macmini, nemesis/Air): brew update+upgrade (no reboot), then
#      re-install the tailscaled system daemon if brew moved past it
#   6. Registry DNS assert on all K3s nodes
#   7. Proxmox host userspace pass (imported 81-upgrade-proxmox.yml, no reboot)
#
# Drains (phases 2+3) run scripts/longhorn-drain-guard.sh around them: 1-replica
# Longhorn volumes on the node get their workload stopped + the drain policy
# relaxed, restored in an always: (#82). Override the drain timeout with
# -e drain_timeout=900s. Run long fleet passes from the macmini, not a laptop.
#
# K3s binary is installed via script, not apt — apt won't touch it.
# =============================================================================

- name: Phase 1 — non-cluster hosts (parallel, OS-aware)
  # !k3s_cluster: minisforum-c sits in BOTH sff_nodes and k3s_x86_agents.
  # Without the exclusion it gets pacman'd + rebooted here in parallel with
  # no kubectl/Longhorn wait — which took the node (and the only replica of
  # the Prometheus volume) down hard on 2026-07-11. Cluster members are only
  # ever touched by the serial phases below.
  hosts: gpu_servers:sff_nodes:security_stack:game_servers:!k3s_cluster
  become: true
  gather_facts: true
  tasks:
    - name: apt update + upgrade (Debian family)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: "yes"
        autoremove: yes
        autoclean: yes
      when: ansible_os_family == 'Debian'

    - name: pacman -Syu (Arch family)
      community.general.pacman:
        update_cache: yes
        upgrade: yes
      when: ansible_os_family == 'Archlinux'

    - name: Check reboot-required (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_deb
      when: ansible_os_family == 'Debian'

    - name: Detect newest installed kernel (Debian)
      ansible.builtin.shell: ls -1 /boot/vmlinuz-* | sed 's/.*vmlinuz-//' | sort -V | tail -1
      register: newest_kernel
      when: ansible_os_family == 'Debian'
      changed_when: false

    - name: Reboot Debian if flagged
      ansible.builtin.reboot:
        msg: "Reboot triggered by apt upgrade"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        reboot_timeout: 600
      when:
        - ansible_os_family == 'Debian'
        - reboot_required_deb.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel

    - name: Reboot Arch family unconditionally (kernel/module drift risk)
      ansible.builtin.reboot:
        msg: "Reboot triggered by pacman -Syu"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        reboot_timeout: 600
      when: ansible_os_family == 'Archlinux'

- name: Phase 2 — K3s agents (serial, OS-aware)
  hosts: k3s_agents:k3s_x86_agents
  become: true
  serial: 1
  tasks:
    # PRE-reboot gate (2026-07-24): if a previous node's reboot left volumes
    # still rebuilding, rebooting this node could take down the only healthy
    # replica and fault the volume. Wait for full redundancy BEFORE touching
    # this host, not just after its own reboot.
    - name: Pre-flight — wait for Longhorn volumes to be fully redundant
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_pre
      until: lh_pre.stdout | trim == "0"
      retries: 360
      delay: 10
      changed_when: false

    - name: apt update + upgrade (Debian family)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: "yes"
        autoremove: yes
        autoclean: yes
      when: ansible_os_family == 'Debian'

    - name: pacman -Syu (Arch family)
      community.general.pacman:
        update_cache: yes
        upgrade: yes
      when: ansible_os_family == 'Archlinux'

    - name: Check reboot-required (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_deb
      when: ansible_os_family == 'Debian'

    - name: Detect newest installed kernel (Debian)
      ansible.builtin.shell: ls -1 /boot/vmlinuz-* | sed 's/.*vmlinuz-//' | sort -V | tail -1
      register: newest_kernel
      when: ansible_os_family == 'Debian'
      changed_when: false

    # #82 (2026-10-16): a 1-replica Longhorn volume whose only replica is on
    # this node blocks the drain forever (IM PDB under
    # block-if-contains-last-replica). Stop its workload + relax the policy
    # first; the always: below puts both back. State is kept in annotations
    # on the cluster, so `scripts/longhorn-drain-guard.sh post` also recovers
    # an aborted run by hand.
    - name: Longhorn single-replica guard (scale owners to 0, relax drain policy)
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: ["{{ playbook_dir }}/../../scripts/longhorn-drain-guard.sh", pre, "{{ inventory_hostname }}"]
      register: lh_guard
      changed_when: "'scaled' in lh_guard.stdout or 'node-drain-policy' in lh_guard.stdout"
      when: >
        ansible_os_family == 'Archlinux' or
        (ansible_os_family == 'Debian' and
         (reboot_required_deb.stat.exists or
          (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel))

    # Silence this node's own alerts (NodeDown/KubeNodeNotReady/… carry
    # instance= or node=) for the drain + reboot; expired in the always: below.
    # 1h is the safety cap. Same gate as the guard: only when it reboots.
    - name: Silence this node's alerts for the reboot
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: ["{{ playbook_dir }}/../../scripts/maint-silence.sh", add, "reboot-{{ inventory_hostname }}", 1h, "{{ item }}"]
      loop:
        - 'instance="{{ inventory_hostname }}"'
        - 'node="{{ inventory_hostname }}"'
      changed_when: true
      when: lh_guard is not skipped

    - name: Drain, reboot, uncordon
      block:
        # Drain BEFORE reboot (2026-07-24, minisforum hang #2): systemd kills the
        # Longhorn instance-managers before unmounting the CSI filesystems they
        # back; the unmounts then block forever in D-state and the shutdown hangs
        # (needs a physical power-cycle). Draining evicts the pods and detaches
        # the volumes cleanly while the engines are still alive, so shutdown has
        # no Longhorn mounts left to trip over.
        - name: Drain node before reboot (clean Longhorn detach)
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv:
              - kubectl
              - drain
              - "{{ inventory_hostname }}"
              - --ignore-daemonsets
              - --delete-emptydir-data
              - "--timeout={{ drain_timeout | default('600s') }}"
          when: >
            ansible_os_family == 'Archlinux' or
            (ansible_os_family == 'Debian' and
             (reboot_required_deb.stat.exists or
              (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel))
          register: drained
          changed_when: true

        # Stale-Ready guard (2026-10-24, #82.1): `kubectl wait --for=condition=Ready`
        # passed on the node object's PRE-reboot Ready (minisforum-c booted in
        # <1 min, faster than the 40 s NotReady grace) → uncordon, guard restore
        # and silence expiry ran 3 min before the node was really back. Wait for
        # a NEW kubelet bootID + Ready instead.
        - name: Record pre-reboot kubelet bootID
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: [kubectl, get, node, "{{ inventory_hostname }}", -o, "jsonpath={.status.nodeInfo.bootID}"]
          register: pre_boot_id
          changed_when: false

        - name: Reboot Debian if flagged
          ansible.builtin.reboot:
            msg: "Reboot triggered by apt upgrade"
            pre_reboot_delay: 5
            post_reboot_delay: 45
            reboot_timeout: 600
          when:
            - ansible_os_family == 'Debian'
            - reboot_required_deb.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
          register: rebooted_deb

        - name: Reboot Arch family unconditionally (kernel/module drift risk)
          ansible.builtin.reboot:
            msg: "Reboot triggered by pacman -Syu"
            pre_reboot_delay: 5
            post_reboot_delay: 45
            reboot_timeout: 600
          when: ansible_os_family == 'Archlinux'
          register: rebooted_arch

        - name: Wait for node Ready in Kubernetes (new bootID + Ready)
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv:
              - kubectl
              - get
              - node
              - "{{ inventory_hostname }}"
              - -o
              - 'jsonpath={.status.nodeInfo.bootID} {.status.conditions[?(@.type=="Ready")].status}'
          register: node_state
          until: >-
            (node_state.stdout.split() | length) == 2 and
            node_state.stdout.split()[0] != pre_boot_id.stdout and
            node_state.stdout.split()[1] == 'True'
          retries: 60
          delay: 5
          when: (rebooted_deb is defined and rebooted_deb.changed) or (rebooted_arch is defined and rebooted_arch.changed)
          changed_when: false

        - name: Uncordon node after reboot
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv:
              - kubectl
              - uncordon
              - "{{ inventory_hostname }}"
          when: drained is defined and drained.changed
          changed_when: true
      always:
        # After uncordon on success; straight away on failure so a broken drain
        # never leaves Prometheus down or the drain policy relaxed.
        - name: Longhorn single-replica guard (restore policy + workloads)
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: ["{{ playbook_dir }}/../../scripts/longhorn-drain-guard.sh", post]
          register: lh_guard_post
          changed_when: lh_guard_post.stdout | length > 0

        - name: Expire this node's reboot silences
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: ["{{ playbook_dir }}/../../scripts/maint-silence.sh", expire, "reboot-{{ inventory_hostname }}"]
          register: node_unsilence
          changed_when: node_unsilence.stdout | length > 0

    # Node Ready is NOT enough: Longhorn replicas on the rebooted node need
    # time to rebuild. Rebooting the next storage node while volumes are
    # still degraded can fault a volume outright (2026-07-11: Prometheus
    # volume lost when x86 nodes rebooted back-to-back mid-rebuild).
    - name: Wait for Longhorn volumes to regain full redundancy
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_degraded
      until: lh_degraded.stdout | trim == "0"
      # 360 x 10s = 60 min: cross-site (Site Magic) delta resyncs after a
      # reboot legitimately exceed the old 15 min budget (2026-07-24 run:
      # x86-2's gate expired at 15 min with rebuilds at ~50%, aborting the
      # whole playbook mid-fleet).
      retries: 360
      delay: 10
      when: (rebooted_deb is defined and rebooted_deb.changed) or (rebooted_arch is defined and rebooted_arch.changed)
      changed_when: false

- name: Phase 3 — K3s servers (serial, etcd quorum safe)
  hosts: k3s_server
  become: true
  serial: 1
  tasks:
    - name: Pre-flight — wait for Longhorn volumes to be fully redundant
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_pre
      until: lh_pre.stdout | trim == "0"
      retries: 360
      delay: 10
      changed_when: false

    - name: apt update + upgrade
      ansible.builtin.apt:
        update_cache: yes
        upgrade: "yes"
        autoremove: yes
        autoclean: yes

    - name: Check reboot-required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Detect newest installed kernel (before the drain — its condition reads it)
      ansible.builtin.shell: ls -1 /boot/vmlinuz-* | sed 's/.*vmlinuz-//' | sort -V | tail -1
      register: newest_kernel
      changed_when: false

    # #82 (2026-10-16): a 1-replica Longhorn volume whose only replica is on
    # this node blocks the drain forever (IM PDB under
    # block-if-contains-last-replica). Stop its workload + relax the policy
    # first; the always: below puts both back. State is kept in annotations
    # on the cluster, so `scripts/longhorn-drain-guard.sh post` also recovers
    # an aborted run by hand.
    - name: Longhorn single-replica guard (scale owners to 0, relax drain policy)
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: ["{{ playbook_dir }}/../../scripts/longhorn-drain-guard.sh", pre, "{{ inventory_hostname }}"]
      register: lh_guard
      changed_when: "'scaled' in lh_guard.stdout or 'node-drain-policy' in lh_guard.stdout"
      when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel

    # Silence this node's own alerts (NodeDown/KubeNodeNotReady/… carry
    # instance= or node=) for the drain + reboot; expired in the always: below.
    # 1h is the safety cap. Same gate as the guard: only when it reboots.
    - name: Silence this node's alerts for the reboot
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: ["{{ playbook_dir }}/../../scripts/maint-silence.sh", add, "reboot-{{ inventory_hostname }}", 1h, "{{ item }}"]
      loop:
        - 'instance="{{ inventory_hostname }}"'
        - 'node="{{ inventory_hostname }}"'
      changed_when: true
      when: lh_guard is not skipped

    # Rebooting an etcd voter moves the leader; EtcdLeaderChanges
    # (increase[1h] > 2) then fires on all three servers (2026-10-15 fleet run).
    # Not expired: 2h covers the reboot plus the 1h lookback.
    - name: Silence EtcdLeaderChanges across the server reboot
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: ["{{ playbook_dir }}/../../scripts/maint-silence.sh", add, "etcd-{{ inventory_hostname }}", 2h, alertname=EtcdLeaderChanges]
      changed_when: true
      when: lh_guard is not skipped

    - name: Drain, reboot, uncordon
      block:
        - name: Drain node before reboot (clean Longhorn detach)
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv:
              - kubectl
              - drain
              - "{{ inventory_hostname }}"
              - --ignore-daemonsets
              - --delete-emptydir-data
              - "--timeout={{ drain_timeout | default('600s') }}"
          when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
          register: drained
          changed_when: true

        # Stale-Ready guard (2026-10-24, #82.1): `kubectl wait --for=condition=Ready`
        # passed on the node object's PRE-reboot Ready (minisforum-c booted in
        # <1 min, faster than the 40 s NotReady grace) → uncordon, guard restore
        # and silence expiry ran 3 min before the node was really back. Wait for
        # a NEW kubelet bootID + Ready instead.
        - name: Record pre-reboot kubelet bootID
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: [kubectl, get, node, "{{ inventory_hostname }}", -o, "jsonpath={.status.nodeInfo.bootID}"]
          register: pre_boot_id
          changed_when: false

        - name: Reboot if flagged
          ansible.builtin.reboot:
            msg: "Reboot triggered by apt upgrade (etcd voter)"
            pre_reboot_delay: 10
            post_reboot_delay: 60
            reboot_timeout: 600
          when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel

        - name: Wait for node Ready in Kubernetes (new bootID + Ready)
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv:
              - kubectl
              - get
              - node
              - "{{ inventory_hostname }}"
              - -o
              - 'jsonpath={.status.nodeInfo.bootID} {.status.conditions[?(@.type=="Ready")].status}'
          register: node_state
          until: >-
            (node_state.stdout.split() | length) == 2 and
            node_state.stdout.split()[0] != pre_boot_id.stdout and
            node_state.stdout.split()[1] == 'True'
          retries: 60
          delay: 5
          when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
          changed_when: false

        - name: Uncordon node after reboot
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv:
              - kubectl
              - uncordon
              - "{{ inventory_hostname }}"
          when: drained is defined and drained.changed
          changed_when: true
      always:
        # After uncordon on success; straight away on failure so a broken drain
        # never leaves Prometheus down or the drain policy relaxed.
        - name: Longhorn single-replica guard (restore policy + workloads)
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: ["{{ playbook_dir }}/../../scripts/longhorn-drain-guard.sh", post]
          register: lh_guard_post
          changed_when: lh_guard_post.stdout | length > 0

        - name: Expire this node's reboot silences
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: ["{{ playbook_dir }}/../../scripts/maint-silence.sh", expire, "reboot-{{ inventory_hostname }}"]
          register: node_unsilence
          changed_when: node_unsilence.stdout | length > 0

    - name: Wait for Longhorn volumes to regain full redundancy
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_degraded
      until: lh_degraded.stdout | trim == "0"
      # 360 x 10s = 60 min: cross-site (Site Magic) delta resyncs after a
      # reboot legitimately exceed the old 15 min budget (2026-07-24 run:
      # x86-2's gate expired at 15 min with rebuilds at ~50%, aborting the
      # whole playbook mid-fleet).
      retries: 360
      delay: 10
      when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
      changed_when: false

- name: Phase 4 — Arch/CachyOS desktops (parallel)
  hosts: desktops
  become: true
  tasks:
    # Omarchy 4.x refuses a direct `pacman -Syu` (pre-transaction hook
    # omarchy-update-pacman-guard, 2026-10-17) — it must go through
    # `omarchy update`, which also snapshots, migrates the user's ~/.config,
    # runs post-update hooks (our os-release masquerade) and updates AUR + mise.
    # `-y` is its unattended mode (no prompts; the final reboot `gum confirm`
    # declines without a TTY). It acts on $HOME, so it runs as the desktop user,
    # and calls sudo inside — that user's sudo needs a password, so a NOPASSWD
    # drop-in exists ONLY for the duration of the run (removed in `always`).
    - name: Omarchy desktop?
      ansible.builtin.stat:
        path: /usr/bin/omarchy-update
      register: omarchy_update_bin

    - name: omarchy update -y (as the desktop user)
      when: omarchy_update_bin.stat.exists
      block:
        - name: Temporary NOPASSWD sudo for the desktop user
          ansible.builtin.copy:
            dest: /etc/sudoers.d/zz-ansible-omarchy-update
            # verifypw=any: omarchy-update-stay-awake runs `sudo -v`, which by
            # default still prompts unless EVERY entry for the user is NOPASSWD
            # (the user's own `ALL=(ALL) ALL` line isn't) — freyr 2026-10-17.
            content: |
              Defaults:{{ personal_user }} verifypw=any
              {{ personal_user }} ALL=(ALL) NOPASSWD: ALL
            owner: root
            group: root
            mode: "0440"
            validate: visudo -cf %s

        - name: omarchy update -y
          ansible.builtin.shell: |
            uid=$(id -u {{ personal_user }})
            # `gum confirm` (orphan packages, "reboot?") ignores -y and opens
            # /dev/tty directly, so it hangs forever whenever ANY tty exists:
            # omarchy's own `script` wrapper (skipped via OMARCHY_UPDATE_LOGGED=1)
            # AND the pty Ansible's ssh allocates (freyr + loki 2026-10-17).
            # setsid → no controlling terminal → /dev/tty fails → gum declines.
            exec setsid -w sudo -u {{ personal_user }} -H env XDG_RUNTIME_DIR=/run/user/$uid \
              DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus OMARCHY_UPDATE_LOGGED=1 \
              bash -lc 'omarchy update -y' </dev/null
          register: omarchy_update
          changed_when: "'there is nothing to do' not in omarchy_update.stdout"
      always:
        - name: Remove the temporary sudo drop-in
          ansible.builtin.file:
            path: /etc/sudoers.d/zz-ansible-omarchy-update
            state: absent

    - name: pacman -Syu
      community.general.pacman:
        update_cache: yes
        upgrade: yes
      register: desktop_pacman
      when: not omarchy_update_bin.stat.exists

    # The AUR wazuh-agent package doesn't restart the running agent, so the
    # manager keeps reporting the old client version until the next boot
    # (freyr + loki 4.14.9, 2026-10-17). Hosts that reboot below get it anyway.
    - name: Restart wazuh-agent after an upgrade
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted
      when: omarchy_update is changed or desktop_pacman is changed
      failed_when: false

    # Omarchy installs full-disk LUKS by default: a reboot stops at the unlock
    # prompt with no network/tailscaled/sshd until someone types the passphrase
    # (freyr, 2026-10-17). Reboot only if the root is unencrypted OR unlocks from
    # the TPM (playbook 30 + systemd-cryptenroll). Override with
    # -e desktop_reboot_encrypted=true when someone is at the keyboard.
    - name: Detect a LUKS root that needs a typed passphrase (no TPM2 token)
      ansible.builtin.shell: |
        for d in $(lsblk -nrpo TYPE,PKNAME | awk '$1=="crypt"{print $2}'); do
          cryptsetup luksDump "$d" | grep -q systemd-tpm2 || echo "needs-passphrase $d"
        done
      register: desktop_luks
      changed_when: false

    - name: Reboot
      ansible.builtin.reboot:
        msg: "Reboot triggered by the package upgrade"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        reboot_timeout: 600
      when: desktop_luks.stdout == "" or desktop_reboot_encrypted | default(false) | bool

    - name: Reboot pending (LUKS without TPM2 — needs the passphrase at the console)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: upgraded, NOT rebooted ({{ desktop_luks.stdout | trim }}). Reboot by hand at the keyboard."
      when: desktop_luks.stdout != "" and not (desktop_reboot_encrypted | default(false) | bool)

- name: Phase 5 — macOS (brew, no reboot)
  # /opt/homebrew is owned by the personal user, not the ansible service
  # account, and brew refuses to run as root. Connect as ansible (the only
  # account the controller keys are trusted for — a macmini-run 2026-10-29
  # got "Permission denied" SSHing as the personal user) and become the personal user.
  hosts: macos_nodes
  become: true
  become_user: "{{ personal_user }}"
  gather_facts: false
  # A sleeping Air (lid closed) must not abort phases 6/7: when every host of
  # a play is unreachable Ansible ends the whole run (2026-10-29).
  ignore_unreachable: true
  tasks:
    - name: brew update
      community.general.homebrew:
        update_homebrew: yes

    # --formula ONLY. Plain `brew upgrade` (module upgrade_all) also upgrades
    # casks, and cask uninstall phases shell out to `sudo pkgutil` which
    # prompts for a password — a headless run hangs forever (2026-07-11:
    # 2.5h hang mid-cask before the run was killed). Casks stay manual.
    # The controller's own ansible is a brew formula: upgrading it (or the
    # python@ it runs on) mid-play breaks module resolution for every later
    # task (2026-10-29: "Cannot resolve 'ansible.builtin.shell'"). On the Mac
    # running this play, hold those back — they upgrade whenever the other
    # Mac is the controller (make on-macmini / a run from the Air).
    - name: Controller tailnet IP
      ansible.builtin.command: tailscale ip -4
      delegate_to: localhost
      become: false
      run_once: true
      register: controller_ip
      changed_when: false
      failed_when: false

    - name: brew upgrade (formulae only — casks need interactive sudo)
      ansible.builtin.shell: |
        if [ "{{ ansible_host }}" = "{{ controller_ip.stdout | default('') | trim }}" ]; then
          pkgs=$(/opt/homebrew/bin/brew outdated --formula --quiet | grep -vxE 'ansible|python@[0-9.]+' || true)
          echo "held back on controller: $(/opt/homebrew/bin/brew outdated --formula --quiet | grep -xE 'ansible|python@[0-9.]+' | tr '\n' ' ')"
          if [ -n "$pkgs" ]; then /opt/homebrew/bin/brew upgrade --formula $pkgs; fi
        else
          /opt/homebrew/bin/brew upgrade --formula
        fi
      register: brew_upgrade
      changed_when: "'Upgrading' in (brew_upgrade.stdout | default('')) or 'Pouring' in (brew_upgrade.stdout | default(''))"

- name: Phase 5b — macOS tailscaled system daemon
  # The LaunchDaemon runs a COPY at /usr/local/bin/tailscaled made by
  # install-system-daemon, so `brew upgrade` alone leaves the old daemon
  # running (2026-10-27: CLI 1.104.x, daemons 1.96.4 / 1.98.5). Re-copy when
  # the brew binary is newer. Never symlink instead — launchd kills it
  # (OS_REASON_CODESIGNING). Runs as the ansible account (passwordless sudo).
  hosts: macos_nodes
  become: true
  gather_facts: false
  ignore_unreachable: true
  vars:
    brew_tailscaled: /opt/homebrew/opt/tailscale/bin/tailscaled
  tasks:
    - name: Compare brew tailscaled with the installed daemon
      ansible.builtin.shell: |
        [ -x {{ brew_tailscaled }} ] || exit 0
        echo "$({{ brew_tailscaled }} --version | head -1) $(/usr/local/bin/tailscaled --version 2>/dev/null | head -1)"
      register: tsd_versions
      changed_when: false

    # The daemon restart drops tailnet SSH (= this connection) for a few
    # seconds: fire-and-forget, then wait for the host to come back.
    - name: Re-install tailscaled system daemon from brew
      ansible.builtin.command: "{{ brew_tailscaled }} install-system-daemon"
      async: 120
      poll: 0
      when:
        - tsd_versions.stdout | length > 0
        - tsd_versions.stdout.split() | length < 2 or tsd_versions.stdout.split()[0] != tsd_versions.stdout.split()[1]
      register: tsd_install

    - name: Wait for the host to rejoin the tailnet
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180
      when: tsd_install is changed

    - name: Daemon version now running
      ansible.builtin.shell: /usr/local/bin/tailscaled --version | head -1
      register: tsd_now
      changed_when: false
      when: tsd_install is changed
      failed_when: tsd_now.stdout != tsd_versions.stdout.split()[0]

- name: Phase 6 — Assert registry DNS resolves on all K3s nodes
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Resolve Gitea registry hostname (catches cloud-init /etc/hosts wipes)
      ansible.builtin.command: >
        getent hosts {{ gitea_registry_host | default('gitea.' + (local_domain | default('homielab.local'))) }}
      changed_when: false

# Phase 7 — Proxmox host userspace patching. Kernel updates are staged only;
# activation reboots take down both x86 K3s VMs + wazuh at once and are a
# deliberate `81-upgrade-proxmox.yml -e reboot=true` planned-window run.
# WARNING: never pass `-e reboot=true` to THIS playbook — extra-vars are
# global and would trigger the pve reboot window at the end of a fleet sweep.
- name: Phase 7 — Proxmox host userspace pass
  ansible.builtin.import_playbook: 81-upgrade-proxmox.yml

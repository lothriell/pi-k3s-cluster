---
# =============================================================================
# Package upgrade across all managed nodes, with auto-reboot where required.
# =============================================================================
# Idempotent: re-runnable. Already-up-to-date hosts become no-ops.
#
# Phases:
#   1. Non-cluster hosts (parallel): gpu_servers, sff_nodes, security_stack
#      — mixed Ubuntu (apt) and CachyOS (pacman) handled by OS family
#   2. K3s agents (serial=1): preserves workload availability, kubectl wait
#   3. K3s servers (serial=1): preserves etcd quorum, kubectl wait
#   4. Arch/CachyOS desktops (parallel): pacman -Syu + reboot
#   5. macmini: brew update+upgrade (no reboot)
#   6. Registry DNS assert on all K3s nodes
#   7. Proxmox host userspace pass (imported 81-upgrade-proxmox.yml, no reboot)
#
# K3s binary is installed via script, not apt — apt won't touch it.
# =============================================================================

- name: Phase 1 — non-cluster hosts (parallel, OS-aware)
  # !k3s_cluster: minisforum-c sits in BOTH sff_nodes and k3s_x86_agents.
  # Without the exclusion it gets pacman'd + rebooted here in parallel with
  # no kubectl/Longhorn wait — which took the node (and the only replica of
  # the Prometheus volume) down hard on 2026-07-11. Cluster members are only
  # ever touched by the serial phases below.
  hosts: gpu_servers:sff_nodes:security_stack:!k3s_cluster
  become: true
  gather_facts: true
  tasks:
    - name: apt update + upgrade (Debian family)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: "yes"
        autoremove: yes
        autoclean: yes
      when: ansible_os_family == 'Debian'

    - name: pacman -Syu (Arch family)
      community.general.pacman:
        update_cache: yes
        upgrade: yes
      when: ansible_os_family == 'Archlinux'

    - name: Check reboot-required (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_deb
      when: ansible_os_family == 'Debian'

    - name: Detect newest installed kernel (Debian)
      ansible.builtin.shell: ls -1 /boot/vmlinuz-* | sed 's/.*vmlinuz-//' | sort -V | tail -1
      register: newest_kernel
      when: ansible_os_family == 'Debian'
      changed_when: false

    - name: Reboot Debian if flagged
      ansible.builtin.reboot:
        msg: "Reboot triggered by apt upgrade"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        reboot_timeout: 600
      when:
        - ansible_os_family == 'Debian'
        - reboot_required_deb.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel

    - name: Reboot Arch family unconditionally (kernel/module drift risk)
      ansible.builtin.reboot:
        msg: "Reboot triggered by pacman -Syu"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        reboot_timeout: 600
      when: ansible_os_family == 'Archlinux'

- name: Phase 2 — K3s agents (serial, OS-aware)
  hosts: k3s_agents:k3s_x86_agents
  become: true
  serial: 1
  tasks:
    # PRE-reboot gate (2026-07-24): if a previous node's reboot left volumes
    # still rebuilding, rebooting this node could take down the only healthy
    # replica and fault the volume. Wait for full redundancy BEFORE touching
    # this host, not just after its own reboot.
    - name: Pre-flight — wait for Longhorn volumes to be fully redundant
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_pre
      until: lh_pre.stdout | trim == "0"
      retries: 360
      delay: 10
      changed_when: false

    - name: apt update + upgrade (Debian family)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: "yes"
        autoremove: yes
        autoclean: yes
      when: ansible_os_family == 'Debian'

    - name: pacman -Syu (Arch family)
      community.general.pacman:
        update_cache: yes
        upgrade: yes
      when: ansible_os_family == 'Archlinux'

    - name: Check reboot-required (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_deb
      when: ansible_os_family == 'Debian'

    - name: Detect newest installed kernel (Debian)
      ansible.builtin.shell: ls -1 /boot/vmlinuz-* | sed 's/.*vmlinuz-//' | sort -V | tail -1
      register: newest_kernel
      when: ansible_os_family == 'Debian'
      changed_when: false

    # Drain BEFORE reboot (2026-07-24, minisforum hang #2): systemd kills the
    # Longhorn instance-managers before unmounting the CSI filesystems they
    # back; the unmounts then block forever in D-state and the shutdown hangs
    # (needs a physical power-cycle). Draining evicts the pods and detaches
    # the volumes cleanly while the engines are still alive, so shutdown has
    # no Longhorn mounts left to trip over.
    - name: Drain node before reboot (clean Longhorn detach)
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - drain
          - "{{ inventory_hostname }}"
          - --ignore-daemonsets
          - --delete-emptydir-data
          - --timeout=600s
      when: >
        ansible_os_family == 'Archlinux' or
        (ansible_os_family == 'Debian' and
         (reboot_required_deb.stat.exists or
          (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel))
      register: drained
      changed_when: true

    - name: Reboot Debian if flagged
      ansible.builtin.reboot:
        msg: "Reboot triggered by apt upgrade"
        pre_reboot_delay: 5
        post_reboot_delay: 45
        reboot_timeout: 600
      when:
        - ansible_os_family == 'Debian'
        - reboot_required_deb.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
      register: rebooted_deb

    - name: Reboot Arch family unconditionally (kernel/module drift risk)
      ansible.builtin.reboot:
        msg: "Reboot triggered by pacman -Syu"
        pre_reboot_delay: 5
        post_reboot_delay: 45
        reboot_timeout: 600
      when: ansible_os_family == 'Archlinux'
      register: rebooted_arch

    - name: Wait for node Ready in Kubernetes
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - node
          - "{{ inventory_hostname }}"
          - --for=condition=Ready
          - --timeout=300s
      when: (rebooted_deb is defined and rebooted_deb.changed) or (rebooted_arch is defined and rebooted_arch.changed)
      changed_when: false

    - name: Uncordon node after reboot
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - uncordon
          - "{{ inventory_hostname }}"
      when: drained is defined and drained.changed
      changed_when: true

    # Node Ready is NOT enough: Longhorn replicas on the rebooted node need
    # time to rebuild. Rebooting the next storage node while volumes are
    # still degraded can fault a volume outright (2026-07-11: Prometheus
    # volume lost when x86 nodes rebooted back-to-back mid-rebuild).
    - name: Wait for Longhorn volumes to regain full redundancy
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_degraded
      until: lh_degraded.stdout | trim == "0"
      # 360 x 10s = 60 min: cross-site (Site Magic) delta resyncs after a
      # reboot legitimately exceed the old 15 min budget (2026-07-24 run:
      # x86-2's gate expired at 15 min with rebuilds at ~50%, aborting the
      # whole playbook mid-fleet).
      retries: 360
      delay: 10
      when: (rebooted_deb is defined and rebooted_deb.changed) or (rebooted_arch is defined and rebooted_arch.changed)
      changed_when: false

- name: Phase 3 — K3s servers (serial, etcd quorum safe)
  hosts: k3s_server
  become: true
  serial: 1
  tasks:
    - name: Pre-flight — wait for Longhorn volumes to be fully redundant
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_pre
      until: lh_pre.stdout | trim == "0"
      retries: 360
      delay: 10
      changed_when: false

    - name: apt update + upgrade
      ansible.builtin.apt:
        update_cache: yes
        upgrade: "yes"
        autoremove: yes
        autoclean: yes

    - name: Check reboot-required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Drain node before reboot (clean Longhorn detach)
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - drain
          - "{{ inventory_hostname }}"
          - --ignore-daemonsets
          - --delete-emptydir-data
          - --timeout=600s
      when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
      register: drained
      changed_when: true

    - name: Detect newest installed kernel 
      ansible.builtin.shell: ls -1 /boot/vmlinuz-* | sed 's/.*vmlinuz-//' | sort -V | tail -1
      register: newest_kernel
      changed_when: false

    - name: Reboot if flagged
      ansible.builtin.reboot:
        msg: "Reboot triggered by apt upgrade (etcd voter)"
        pre_reboot_delay: 10
        post_reboot_delay: 60
        reboot_timeout: 600
      when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel

    - name: Wait for node Ready in Kubernetes
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - node
          - "{{ inventory_hostname }}"
          - --for=condition=Ready
          - --timeout=300s
      when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
      changed_when: false

    - name: Uncordon node after reboot
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - uncordon
          - "{{ inventory_hostname }}"
      when: drained is defined and drained.changed
      changed_when: true

    - name: Wait for Longhorn volumes to regain full redundancy
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        kubectl get volumes.longhorn.io -n longhorn-system -o json
        | jq '[.items[] | select(.status.robustness == "degraded")] | length'
      register: lh_degraded
      until: lh_degraded.stdout | trim == "0"
      # 360 x 10s = 60 min: cross-site (Site Magic) delta resyncs after a
      # reboot legitimately exceed the old 15 min budget (2026-07-24 run:
      # x86-2's gate expired at 15 min with rebuilds at ~50%, aborting the
      # whole playbook mid-fleet).
      retries: 360
      delay: 10
      when: reboot_required.stat.exists or (newest_kernel.stdout | default(ansible_kernel)) != ansible_kernel
      changed_when: false

- name: Phase 4 — Arch/CachyOS desktops (parallel)
  hosts: desktops
  become: true
  tasks:
    - name: pacman -Syu
      community.general.pacman:
        update_cache: yes
        upgrade: yes

    - name: Reboot
      ansible.builtin.reboot:
        msg: "Reboot triggered by pacman -Syu"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        reboot_timeout: 600

- name: Phase 5 — macmini (brew, no reboot)
  # /opt/homebrew is owned by the personal user, not the ansible service
  # account. Connect as that user and skip become (brew refuses to run as
  # root anyway).
  hosts: macos_nodes
  remote_user: "{{ personal_user }}"
  become: false
  gather_facts: false
  tasks:
    - name: brew update
      community.general.homebrew:
        update_homebrew: yes

    # --formula ONLY. Plain `brew upgrade` (module upgrade_all) also upgrades
    # casks, and cask uninstall phases shell out to `sudo pkgutil` which
    # prompts for a password — a headless run hangs forever (2026-07-11:
    # 2.5h hang mid-cask before the run was killed). Casks stay manual.
    - name: brew upgrade (formulae only — casks need interactive sudo)
      ansible.builtin.command: /opt/homebrew/bin/brew upgrade --formula
      register: brew_upgrade
      changed_when: "'Upgrading' in brew_upgrade.stdout or 'Pouring' in brew_upgrade.stdout"

- name: Phase 6 — Assert registry DNS resolves on all K3s nodes
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Resolve Gitea registry hostname (catches cloud-init /etc/hosts wipes)
      ansible.builtin.command: >
        getent hosts {{ gitea_registry_host | default('gitea.' + (local_domain | default('homielab.local'))) }}
      changed_when: false

# Phase 7 — Proxmox host userspace patching. Kernel updates are staged only;
# activation reboots take down both x86 K3s VMs + wazuh at once and are a
# deliberate `81-upgrade-proxmox.yml -e reboot=true` planned-window run.
# WARNING: never pass `-e reboot=true` to THIS playbook — extra-vars are
# global and would trigger the pve reboot window at the end of a fleet sweep.
- name: Phase 7 — Proxmox host userspace pass
  ansible.builtin.import_playbook: 81-upgrade-proxmox.yml

---
# Playbook: Setup shell environment on all nodes
# =============================================================================
# Installs zsh, oh-my-zsh, oh-my-posh, eza, and configures the same shell
# experience as the workstation for the personal user on all Pi nodes.
#
# Usage:
#   make shell
# =============================================================================

- name: Setup shell environment
  hosts: "{{ target_hosts | default('k3s_cluster') }}"
  become: true
  vars:
    # Override via --extra-vars '{"shell_users":["myuser","root"]}' to bootstrap multiple users
    shell_users: ["{{ personal_user }}"]

  tasks:
    # -- Install packages ------------------------------------------------------

    # OS-aware since 2026-07-25: the Arch/CachyOS desktops hit the apt-only
    # path ("No such file or directory: update") when this play was extended
    # beyond the Ubuntu fleet.
    - name: Install zsh and dependencies (Debian family)
      ansible.builtin.apt:
        name:
          - zsh
          - git
          - curl
          - unzip
          - fontconfig
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'
      tags: [packages]

    - name: Install zsh, eza and dependencies (Arch family)
      community.general.pacman:
        name:
          - zsh
          - git
          - curl
          - unzip
          - fontconfig
          - eza
        state: present
      when: ansible_os_family == 'Archlinux'
      tags: [packages]

    # armv6l excluded: gierens ships no armhf/armv6 packages (rpizerow —
    # Pi Zero W v1). The zshrc's eza aliases are guarded and fall back to
    # plain ls there.
    - name: Install eza (Debian family — gierens repo)
      ansible.builtin.shell: |
        if ! command -v eza &>/dev/null; then
          wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
          echo "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main" | tee /etc/apt/sources.list.d/gierens.list
          apt update
          apt install -y eza
        fi
      args:
        creates: /usr/bin/eza
      when: ansible_os_family == 'Debian' and ansible_architecture != 'armv6l'
      tags: [packages]

    # -- Install Oh My Posh (host-level, once) --------------------------------

    - name: Check if oh-my-posh is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/oh-my-posh
      register: omp_bin
      tags: [omp]

    - name: Install oh-my-posh
      ansible.builtin.shell: |
        curl -fsSL https://ohmyposh.dev/install.sh | bash -s -- -d /usr/local/bin
      when: not omp_bin.stat.exists
      tags: [omp]

    # -- Per-user configuration (loop over shell_users) ------------------------

    - name: Set zsh as default shell
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /usr/bin/zsh
      loop: "{{ shell_users }}"
      tags: [shell]

    - name: Build user-to-home mapping (/root for root, /home/<user> otherwise)
      ansible.builtin.set_fact:
        user_homes: "{{ user_homes | default({}) | combine({item: ('/root' if item == 'root' else '/home/' + item)}) }}"
      loop: "{{ shell_users }}"
      tags: [omz, omp, zshrc, shell]

    - name: Check if Oh My Zsh is already installed per user
      ansible.builtin.stat:
        path: "{{ user_homes[item] }}/.oh-my-zsh"
      register: omz_dir
      loop: "{{ shell_users }}"
      tags: [omz]

    - name: Install Oh My Zsh per user
      ansible.builtin.shell: |
        su - {{ item.item }} -c 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
      loop: "{{ omz_dir.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists
      tags: [omz]

    # As the owning user via sudo -u (same pattern as the omz install task):
    # root-clone + later chown broke RE-runs with git "dubious ownership"
    # (rpi-k3s-4, 2026-07-25), and module-level become_user needs acl on the
    # target for unprivileged temp files — sudo -u avoids both.
    - name: Install/update zsh-autosuggestions plugin per user
      ansible.builtin.shell: |
        DEST="{{ user_homes[item] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        if [ -d "$DEST/.git" ]; then
          sudo -u {{ item }} git -C "$DEST" pull --ff-only >/dev/null 2>&1 && echo present
        else
          sudo -u {{ item }} git clone --depth 1 https://github.com/zsh-users/zsh-autosuggestions.git "$DEST" && echo cloned
        fi
      register: zsh_plugin
      changed_when: "'cloned' in zsh_plugin.stdout"
      loop: "{{ shell_users }}"
      tags: [omz]

    - name: Fix oh-my-zsh ownership per user
      ansible.builtin.file:
        path: "{{ user_homes[item] }}/.oh-my-zsh"
        owner: "{{ item }}"
        group: "{{ item }}"
        recurse: true
      loop: "{{ shell_users }}"
      tags: [omz]

    - name: Create oh-my-posh themes directory per user
      ansible.builtin.file:
        path: "{{ user_homes[item] }}/.config/oh-my-posh/themes"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0755"
      loop: "{{ shell_users }}"
      tags: [omp]

    - name: Copy custom atomic theme per user
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../dotfiles/oh-my-posh/atomic.omp.json"
        dest: "{{ user_homes[item] }}/.config/oh-my-posh/themes/atomic.omp.json"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0644"
      loop: "{{ shell_users }}"
      tags: [omp]

    # -- Root prompt (bash + oh-my-posh, NOT zsh) ------------------------------
    # Root keeps bash as its shell (rescue-path integrity: /bin/bash must
    # always start, no omz/plugins running as root). This only themes the
    # prompt: guarded init in .bashrc degrades to a plain prompt if omp or
    # the theme file is ever missing/broken — a bashrc failure never blocks
    # root login the way a broken login shell would.
    - name: Ensure root theme directory exists
      ansible.builtin.file:
        path: /root/.config/oh-my-posh/themes
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [root-prompt]

    - name: Copy atomic theme for root
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../dotfiles/oh-my-posh/atomic.omp.json"
        dest: /root/.config/oh-my-posh/themes/atomic.omp.json
        owner: root
        group: root
        mode: "0644"
      tags: [root-prompt]

    - name: Init oh-my-posh in root .bashrc (guarded)
      ansible.builtin.blockinfile:
        path: /root/.bashrc
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} oh-my-posh prompt (ansible 00-setup-shell, root-prompt)"
        block: |
          if command -v oh-my-posh >/dev/null 2>&1 && [ -f /root/.config/oh-my-posh/themes/atomic.omp.json ]; then
            eval "$(oh-my-posh init bash --config /root/.config/oh-my-posh/themes/atomic.omp.json)"
          fi
      tags: [root-prompt]

    - name: Deploy .zshrc per user
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../dotfiles/zshrc"
        dest: "{{ user_homes[item] }}/.zshrc"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0644"
      loop: "{{ shell_users }}"
      tags: [zshrc]

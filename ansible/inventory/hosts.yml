---
# Raspberry Pi CM5 K3s Cluster Inventory
#
# Environment-specific values (IPs, username, etc.) are in:
#   ansible/inventory/group_vars/all.yml (gitignored)
#
# To set up: cp group_vars/all.yml.example group_vars/all.yml

all:
  vars:
    k3s_version: "v1.36.3+k3s1"
    # timezone is set in group_vars/all/main.yml (file group_vars override inline)
    ansible_python_interpreter: /usr/bin/python3

  children:
    # HA control plane: 3 Pi nodes with embedded etcd.
    # First host in group runs `--cluster-init`; subsequent hosts join via
    # the first server's IP (kube-vip isn't up yet during bootstrap).
    # Client traffic (kubectl, agents, ArgoCD) hits the VIP (k3s_api_vip).
    k3s_server:
      hosts:
        rpi-k3s-1:
          ansible_host: "{{ node_ip_1 }}"
        rpi-k3s-2:
          ansible_host: "{{ node_ip_2 }}"
        rpi-k3s-3:
          ansible_host: "{{ node_ip_3 }}"

    k3s_agents:
      hosts:
        rpi-k3s-4:
          ansible_host: "{{ node_ip_4 }}"

    k3s_x86_agents:
      hosts:
        k3s-x86-1:
          ansible_host: "{{ x86_node_ip_1 }}"
        k3s-x86-2:
          ansible_host: "{{ x86_node_ip_2 }}"
        # minisforum-c is also kept in sff_nodes for Wazuh-agent management
        # and shell setup. Phase 2 of 80-upgrade-packages.yml is OS-aware so
        # the double membership doesn't cause apt failures on the Arch host.
        minisforum-c:
          ansible_host: "{{ sff_minisforum_ip }}"

    k3s_cluster:
      children:
        k3s_server:
        k3s_agents:
        k3s_x86_agents:

    # Proxmox hypervisor (remote site) — hosts the x86 K3s VMs + wazuh VM
    # (+ the desktop VMs). Patched by 81-upgrade-proxmox.yml: userspace-only
    # by default (also imported at the end of 80-upgrade-packages.yml);
    # kernel-activation reboots take down both x86 VMs at once and are a
    # planned-window run with `-e reboot=true` (task #68).
    proxmox_hosts:
      hosts:
        pve-1:
          ansible_host: "{{ pve_host_ip }}"

    # minisforum-c doubles as the GPU/LLM box (RTX 3090, Ollama via Docker).
    # It is the SAME host as the k3s_x86_agents member — one machine, one IP.
    # The former separate "gpu-1" identity (pre-K3s life on the SFF VLAN) was
    # removed 2026-07-24: its stale IP had been dead since the 2026-05-11
    # VLAN move and silently broke the ollama-external proxy.
    gpu_servers:
      hosts:
        minisforum-c:
          ansible_host: "{{ sff_minisforum_ip }}"

    sff_nodes:
      hosts:
        athena:
          ansible_host: "{{ sff_athena_ip }}"
        artemis:
          ansible_host: "{{ sff_artemis_ip }}"
        minisforum-c:
          ansible_host: "{{ sff_minisforum_ip }}"

    desktops:
      hosts:
        arch-t-01:
          ansible_host: "{{ tailscale_arch_t_01 }}"
        cachy-t-01:
          ansible_host: "{{ tailscale_cachy_t_01 }}"
        loki:                                  # Dell laptop, Omarchy (Arch family); roams → tailnet IP
          ansible_host: "{{ tailscale_loki }}"

    # macOS nodes — bootstrapped outside of the numbered playbooks (macOS has no
    # adduser/usermod). Not part of the K3s cluster; kept as a managed host
    # because it has LAN reach to the remote Servers VLAN and can act as a
    # jump host (ProxyJump) to workloads that the controller cannot reach.
    macos_nodes:
      hosts:
        macmini:
          ansible_host: "{{ tailscale_macmini }}"

    # Low-power display/infotainment nodes — NOT K3s members (rpizerow is a
    # Pi Zero W v1: single-core ARMv6, 512 MB, legacy 32-bit Raspbian for the
    # Waveshare 10" e-ink HAT's old SPI driver stack). Management-only:
    # bootstrap, updates, app deploy. ARMv6 caveat: many modern binaries
    # (eza, some oh-my-posh builds) don't ship armv6l — check before adding
    # this group to fleet-wide tooling plays.
    display_nodes:
      hosts:
        rpizerow:
          ansible_host: "{{ display_rpizerow_ip }}"

    # Standalone security VMs (not K3s). Reached over LAN through the macmini
    # ProxyJump (ssh-config wildcard 10.70.10.* → ProxyJump macmini, key auth),
    # mirroring every other cross-VLAN host. NOT the raw Tailscale IP: the VM
    # runs Tailscale SSH (RunSSH) which now enforces a periodic browser re-auth
    # check, so connecting on 100.x times out with "Tailscale SSH requires an
    # additional check" and Ansible reports UNREACHABLE. The Tailscale IP
    # ({{ tailscale_wazuh_server }}) remains as a manual fallback during rebuilds
    # when the LAN/macmini path is down (re-auth in a browser first).
    security_stack:
      hosts:
        wazuh-server:
          ansible_host: "{{ wazuh_manager_ip }}"

    # Windows hosts reached via WSL+OpenSSH. SSH lands in WSL Linux; we use
    # WSL interop (powershell.exe) to act on the Windows side. Used by
    # 16-trust-homielab-ca.yml to install the homielab CA into CurrentUser\Root
    # (no UAC needed). The 'ansible' service account is bootstrapped inside WSL
    # (00-bootstrap-user.yml with target_hosts=windows_wsl_nodes), so these hosts
    # use the default ansible user like every other Linux node. Add new Windows
    # hosts here when they need cluster-issued cert trust.
    windows_wsl_nodes:
      hosts:
        thorwsl:
          ansible_host: "{{ tailscale_thorwsl }}"

---
- name: Verify NVIDIA runtime is available
  ansible.builtin.command: docker info --format '{{ "{{" }} .Runtimes {{ "}}" }}'
  register: docker_runtimes
  changed_when: false

- name: Fail if NVIDIA runtime not found
  ansible.builtin.fail:
    msg: "NVIDIA Container Toolkit not installed. Install it first: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html"
  when: "'nvidia' not in docker_runtimes.stdout"

- name: Pull Ollama Docker image
  community.docker.docker_image:
    name: "{{ ollama_image }}"
    tag: "{{ ollama_image_tag }}"
    source: pull

- name: Create Ollama data volume
  community.docker.docker_volume:
    name: "{{ ollama_data_volume }}"
    state: present

- name: Start Ollama container
  community.docker.docker_container:
    name: "{{ ollama_container_name }}"
    image: "{{ ollama_image }}:{{ ollama_image_tag }}"
    state: started
    restart_policy: unless-stopped
    runtime: nvidia
    env:
      NVIDIA_VISIBLE_DEVICES: "{{ ollama_nvidia_visible_devices }}"
      OLLAMA_HOST: "{{ ollama_host }}"
      OLLAMA_FLASH_ATTENTION: "{{ ollama_flash_attention }}"
      OLLAMA_KEEP_ALIVE: "{{ ollama_keep_alive }}"
      OLLAMA_NUM_PARALLEL: "{{ ollama_num_parallel }}"
    ports:
      - "{{ ollama_port }}:{{ ollama_port }}"
    volumes:
      - "{{ ollama_data_volume }}:/root/.ollama"

# Docker 29 boot race: on cold boot the container comes up published but the
# DOCKER-chain filter ACCEPT for its port is missing -> localhost works while
# every remote path (ollama-external, Traefik) times out silently. Restarting
# the container re-programs the rules. Guard unit checks + fixes at each boot.
# (Seen on the 2026-08-12 Docker 28->29 upgrade AND every cold boot since;
# live-restore is off, so it's not that. memory: feedback_docker_upgrade_ollama_port)
- name: Install ollama-portfix boot guard (restart container if port rule missing)
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama-portfix.service
    mode: "0644"
    content: |
      [Unit]
      Description=Restart ollama container if Docker forgot its iptables port rule (Docker 29 boot race)
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStartPre=/usr/bin/timeout 60 /bin/sh -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
      ExecStart=/bin/sh -c 'sleep 10; if ! iptables -L DOCKER -n | grep -q {{ ollama_port }}; then docker restart {{ ollama_container_name }}; fi'

      [Install]
      WantedBy=multi-user.target
  register: portfix_unit

- name: Enable ollama-portfix guard
  ansible.builtin.systemd:
    name: ollama-portfix.service
    enabled: true
    daemon_reload: "{{ portfix_unit.changed }}"

- name: Wait for Ollama API to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ ollama_port }}/api/tags"
    method: GET
    status_code: 200
  register: ollama_health
  retries: 10
  delay: 5
  until: ollama_health.status == 200

- name: Pull primary model ({{ ollama_model }})
  ansible.builtin.command:
    cmd: docker exec {{ ollama_container_name }} ollama pull {{ ollama_model }}
  register: ollama_pull_primary
  changed_when: "'pulling' in ollama_pull_primary.stdout"
  when: ollama_pull_model

- name: Pull fallback model ({{ ollama_model_fallback }})
  ansible.builtin.command:
    cmd: docker exec {{ ollama_container_name }} ollama pull {{ ollama_model_fallback }}
  register: ollama_pull_fallback_result
  changed_when: "'pulling' in ollama_pull_fallback_result.stdout"
  when: ollama_pull_fallback

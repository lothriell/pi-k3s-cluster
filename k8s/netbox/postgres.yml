# NetBox PostgreSQL — official image (2026-10-17)
# =============================================================================
# Replaces the chart's bundled bitnami/postgresql sub-chart, which ran the
# FLOATING `bitnami/postgresql:latest` (free versioned bitnami images are gone):
# the next PostgreSQL major would have been pulled on a pod restart and refused
# the old data dir. Same move as DefectDojo (k8s/defectdojo/postgres.yml).
#
# Chart side (values-netbox.yml): postgresql.enabled=false + externalDatabase
# (host netbox-pg, existingSecretName netbox-postgresql, key `password`). The
# Secret `netbox-postgresql` (playbook 24) is reused:
#   postgres-password → superuser `postgres`
#   password          → app role `netbox` (NOT superuser)
#
# PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker and expect
# the volume at /var/lib/postgresql (not .../data) — PGDATA left at the default.
# Hardened: non-root 999, read-only rootfs, no caps. NetworkPolicy admits only
# the NetBox app + worker pods (app.kubernetes.io/name=netbox).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-pg-init
  namespace: netbox
data:
  10-netbox-role.sh: |
    #!/bin/bash
    # Runs once, on an empty data dir only (docker-entrypoint-initdb.d).
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$NETBOX_PASSWORD" --username postgres --dbname postgres <<'SQL'
    CREATE ROLE netbox LOGIN PASSWORD :'pw';
    CREATE DATABASE netbox OWNER netbox ENCODING 'UTF8'
      LC_COLLATE 'en_US.utf8' LC_CTYPE 'en_US.utf8' TEMPLATE template0;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-pg
  namespace: netbox
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: netbox-pg
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: netbox-pg
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbox-pg-allowed-ingress
  namespace: netbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: netbox-pg
  policyTypes: [Ingress]
  ingress:
    # NetBox web + worker (+ any chart job) carry app.kubernetes.io/name=netbox.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: netbox
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbox-pg
  namespace: netbox
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: netbox-pg
spec:
  serviceName: netbox-pg
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: netbox-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: netbox-pg
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-trixie
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-postgresql
                  key: postgres-password
            - name: NETBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-postgresql
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -h, 127.0.0.1]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -h, 127.0.0.1]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: init
          configMap:
            name: netbox-pg-init
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-storage   # x86-pinned replicas
        resources:
          requests:
            storage: 8Gi

# NetworkPolicy: trivy-system namespace
#
# Trivy Operator exposes Prometheus metrics on pod port 8080.
# Trivy Server (ClientServer mode) listens on pod port 4954 for scan jobs.
# Scan job pods run in this namespace and query the server over HTTP.
# Prometheus (monitoring ns) scrapes the operator endpoint on 8080.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-system-allowed-ingress
  namespace: trivy-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Prometheus scrapes operator metrics on pod port 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # Scan job pods → Trivy server on port 4954 (intra-namespace).
    # (DR-3 2026-08-30: the pod-CIDR ipBlock added for the kube-router
    # ipset race was removed with the ghcr.io move; if scan jobs start
    # losing the ~3s ipset race again — connection refused to :4954,
    # no new VulnerabilityReports — see feedback_kube_router_race and
    # git history for the ipBlock form.)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4954

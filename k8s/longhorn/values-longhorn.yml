# Longhorn distributed storage for Raspberry Pi CM5 cluster
# 32GB eMMC per node — conservative settings to leave room for OS upgrades

persistence:
  defaultClassReplicaCount: 2    # 2 replicas for pod migration (3 is overkill on 3-4 nodes)

defaultSettings:
  # Storage limits — keep ~10GB free per node for OS + upgrades
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 25    # Stop scheduling when <25% free (~7GB)

  # Exclude rpi-k3s-1 (faulty, cordoned)
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

  # Performance tuning for eMMC
  guaranteedInstanceManagerCPU: 5          # Low CPU guarantee (eMMC is slow anyway)

  # Default 2 replicas
  defaultReplicaCount: 2

  # Data path on eMMC
  defaultDataPath: /var/lib/longhorn

  # Let fstrim reclaim space held by the snapshot chain: marks older
  # snapshots removed so unmapped blocks actually shrink actualSize.
  # Without it, actualSize = lifetime high-water mark (v1.11 engines also
  # silently dropped ALL discards, so weekly fstrim was a no-op forever —
  # 2026-07-27 sweep reclaimed 15.7 GiB per replica; task #71).
  removeSnapshotsDuringFilesystemTrim: true

# Resource limits — keep it light on Pi nodes, but the manager orchestrates ALL
# volumes and spikes during heavy reconcile. 256Mi was too tight: longhorn-manager
# on k3s-x86-1 was OOMKilled at the 2026-06-04 incident onset (01:40 UTC), which
# coincided with the nightly Longhorn snapshot job — a likely trigger of the whole
# attach-storm cascade. Others idled at ~80% of 256Mi. Bumped to 512Mi (trivial on
# 16GB+ nodes).
longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

longhornDriver:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Expose Longhorn UI via Traefik ingress
ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.example.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
